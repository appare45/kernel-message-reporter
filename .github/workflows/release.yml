name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.26"

      - name: Build
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 go build -o dist/kernel-message-reporter-linux-amd64 .
          GOOS=linux GOARCH=arm64 go build -o dist/kernel-message-reporter-linux-arm64 .

      - name: Upload release artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: kernel-message-reporter
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: kernel-message-reporter
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" --generate-notes dist/*
